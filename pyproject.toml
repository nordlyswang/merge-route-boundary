[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-route-boundary"
version = "0.1.0"
description = "Conda-only infrastructure for merge-route boundary experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "PyYAML",
]

[tool.setuptools]
packages = ["mrb", "mrb.data", "mrb.features", "mrb.diagnostics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
