version: 1
root_env: MRB_DATA_ROOT
project_data_env: MRB_PROJECT_DATA

paths:
  shared_root: /root/rivermind-data/datasets
  project_data_dir: /root/rivermind-data/projects/merge-route-boundary/data

datasets:
  mnist:
    tier: 0
    source: torchvision
    torchvision_class: MNIST
    root: ${MRB_DATA_ROOT:-/root/rivermind-data/datasets}/torchvision
    storage_markers: [MNIST/raw]
    loader: train_bool
    task_type: classification
    num_classes: 10
    splits: [train, test]
    sample_counts:
      train: 60000
      test: 10000
    default_image_size: 224
    image_mode: L
    expected_available: true
    allow_in_smoke: false
    large_dataset: false
    manual_download: false
    custom_layout: false
    loader_status: supported
    estimated_gb: 0.1
    notes: "Torchvision MNIST. Loader must use download=False."

  fashion_mnist:
    tier: 0
    source: torchvision
    torchvision_class: FashionMNIST
    root: ${MRB_DATA_ROOT:-/root/rivermind-data/datasets}/torchvision
