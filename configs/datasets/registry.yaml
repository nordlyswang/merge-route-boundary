    loader: train_bool
    task_type: classification
    num_classes: 10
    splits: [train, test]
    sample_counts:
      train: 60000
      test: 10000
    default_image_size: 224
    image_mode: L
    expected_available: true
    allow_in_smoke: false
    large_dataset: false
